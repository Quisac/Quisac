services:
  postgres:
    image: postgres:16-alpine
    container_name: quisac-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-quisac}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quisac}
      POSTGRES_DB: ${POSTGRES_DB:-quisac}
    ports:
      - "5432:5432"
    volumes:
      - quisac-pgdata:/var/lib/postgresql/data
      # Applied once, on first initialisation of an empty data volume.
      - ./src/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-quisac} -d ${POSTGRES_DB:-quisac}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  quisac-pgdata:

{{define "body"}}
<div class="flow-card" style="max-width:420px;">
  <h1 style="font-size:20px;font-weight:400;margin-bottom:.5rem;">Import Git Repository</h1>
  <p style="font-size:14px;color:var(--sub);margin-bottom:2rem;line-height:1.6;">
    Select a Git provider to connect your repository to Quisac.
  </p>

  <a href="/github/connect/go" style="
    display:flex;align-items:center;gap:12px;
    width:100%;padding:13px 18px;
    background:#24292f;color:#fff;
    border:none;border-radius:8px;
    font-family:'Google Sans',sans-serif;font-size:15px;font-weight:500;
    text-decoration:none;cursor:pointer;
    transition:background .15s;margin-bottom:10px;
  ">
    {{template "github-mark" (dict "Size" 20 "Fill" "white")}}
    Continue with GitHub
  </a>

  <p style="font-size:12px;color:var(--muted);text-align:center;margin-top:1.5rem;">
    Only GitHub is supported during early access.
  </p>
</div>
{{end}}

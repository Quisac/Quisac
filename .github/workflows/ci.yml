name: ci

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: set up python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: install python deps
        run: pip install pytest

      - name: set up node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: run backend tests
        run: |
           if [ -d "tests/backend" ]; then pytest tests/backend/; else echo "no tests yet"; fi

      - name: run frontend tests
        run: |
          if [ -d "tests/frontend" ]; then node --test tests/frontend/*.test.js; else echo "no tests yet"; fi
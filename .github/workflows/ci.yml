name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: set up go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: set up node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: run backend tests
        run: |
          if [ -d "tests" ]; then go test ./tests/...; else echo "no tests yet"; fi

      - name: run frontend tests
        run: |
          if [ -d "tests/frontend" ]; then node --test tests/frontend/*.test.js; else echo "no tests yet"; fi